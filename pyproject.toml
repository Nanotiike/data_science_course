[project]
name = "data-science-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=6.31.0",
    "nbformat>=5.11.1",
    "nltk>=3.10.3",
    "pandas>=2.3.3",
    "plotly>=7.0.0",
    "scikit-learn>=1.9.0",
    "wordcloud>=1.9.6",
]

[project.scripts]
data-science-course = "data_science_course:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
